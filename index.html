<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 Welcome to My World! 🎈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
        }
    </style>
</head>
<body class="bg-yellow-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-pink-100 border-8 border-dashed border-red-400 rounded-[3rem] p-6 max-w-sm w-full text-center shadow-[0_10px_0_0_rgba(244,63,94,0.4)] transition-all">
        
        <div class="bg-yellow-300 text-red-500 font-bold px-4 py-1.5 rounded-full inline-block mb-4 text-lg tracking-wider border-4 border-yellow-400 shadow-md transform -rotate-2">
            🎪 WELCOME! 🎈
        </div>

        <div class="relative w-32 h-32 mx-auto mb-4">
            <img class="w-full h-full object-cover rounded-full border-4 border-yellow-300 shadow-lg" 
                 src="https://via.placeholder.com/150/FFB6C1/000000?text=Your+Pic" 
                 alt="Profile Picture">
            <span class="absolute bottom-0 right-0 bg-red-500 text-white p-2 rounded-full border-2 border-white text-xl animate-bounce">
                🔴
            </span>
        </div>

        <h1 class="text-3xl font-extrabold text-red-500 drop-shadow-sm tracking-wide">
            Your Name
        </h1>
        
        <p class="text-purple-600 font-semibold text-sm mb-2">
            ✨ she/they • circus enthusiast ✨
        </p>

        <div class="bg-white/80 rounded-2xl p-3 mb-6 border-2 border-pink-200 text-gray-700 text-sm">
            Welcome to my circus tent! 🤡 I love silly art, retro gaming, and bright colors. 🍿✨
        </div>

        <div class="space-y-3">
            
            <a href="https://instagram.com" target="_blank" 
               class="block bg-yellow-300 hover:bg-yellow-400 text-red-600 font-bold py-3 px-4 rounded-full border-4 border-yellow-400 shadow-[0_4px_0_0_rgba(239,68,68,1)] active:translate-y-1 active:shadow-none transition-all">
               📸 Instagram
            </a>

            <a href="https://twitter.com" target="_blank" 
               class="block bg-blue-300 hover:bg-blue-400 text-blue-900 font-bold py-3 px-4 rounded-full border-4 border-blue-400 shadow-[0_4px_0_0_rgba(30,58,138,1)] active:translate-y-1 active:shadow-none transition-all">
               🐦 Twitter / X
            </a>

            <a href="https://youtube.com" target="_blank" 
               class="block bg-red-300 hover:bg-red-400 text-red-900 font-bold py-3 px-4 rounded-full border-4 border-red-400 shadow-[0_4px_0_0_rgba(153,27,27,1)] active:translate-y-1 active:shadow-none transition-all">
               🎬 YouTube Channel
            </a>

            <a href="mailto:your@email.com" 
               class="block bg-purple-300 hover:bg-purple-400 text-purple-900 font-bold py-3 px-4 rounded-full border-4 border-purple-400 shadow-[0_4px_0_0_rgba(88,28,135,1)] active:translate-y-1 active:shadow-none transition-all">
               💌 Contact Me
            </a>

        </div>

        <div class="mt-6 text-xs text-pink-500 font-bold flex justify-center gap-2">
            <span>🍿</span>
            <span>🎪</span>
            <span>🎨</span>
            <span>🎈</span>
            <span>⭐</span>
        </div>

    </div>

</body>
</html>
