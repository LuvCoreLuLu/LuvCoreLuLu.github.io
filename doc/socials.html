<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 LuvCoreLuLu • Social Links 🎪</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        .dark-circus-bg {
            background-color: #121019;
            background-image: repeating-linear-gradient(
                45deg,
                #121019,
                #121019 35px,
                #1a1726 35px,
                #1a1726 70px
            );
        }

        @keyframes soft-pulse {
            0%, 100% { border-color: #6b3345; }
            50% { border-color: #4c3761; }
        }
        .pulse-border {
            animation: soft-pulse 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="dark-circus-bg min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-10 text-slate-200">

    <!-- MAIN SOCIALS CONTAINER -->
    <div class="relative w-full max-w-md bg-[#1e1b2b]/95 backdrop-blur-md border-4 border-[#5e2d3e] pulse-border rounded-3xl p-6 sm:p-8 shadow-[0_12px_40px_rgba(0,0,0,0.6)]">
        
        <!-- BACK TO HOME BUTTON -->
        <a href="../index.html" class="inline-flex items-center gap-2 bg-[#15131f] hover:bg-[#251f36] text-[#c397d8] text-xs font-bold px-3 py-1.5 rounded-xl border border-[#352c4a] mb-6 transition-colors">
            ← Back to Tent
        </a>

        <!-- HEADER TITLE -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center gap-2 bg-[#2d1b27] text-[#f2a6b4] font-heading font-semibold px-4 py-1.5 rounded-full border border-[#6b3345] text-xs tracking-wider shadow-sm mb-3">
                <span>🤡</span>
                <span>MY SOCIAL NETWORKS</span>
                <span>🎪</span>
            </div>
            <h1 class="text-3xl font-bold text-[#f2a6b4]">Connect With Me</h1>
            <p class="text-xs text-[#c397d8] mt-1">Find all my official social profiles below!</p>
        </div>

        <!-- SOCIAL LINKS LIST -->
        <div class="space-y-3.5">
            
            <!-- INSTAGRAM -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-between bg-[#291a24] hover:bg-[#382230] text-[#f5b8c4] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#593043] shadow-sm hover:border-[#854562] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">📸</span>
                   <span>Instagram</span>
               </div>
               <span class="text-xs text-[#a3768b] group-hover:translate-x-1 transition-transform">↗</span>
            </a>

            <!-- TWITTER / X -->
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-between bg-[#192230] hover:bg-[#202d40] text-[#9bbfe8] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#304766] shadow-sm hover:border-[#466a99] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">🐦</span>
                   <span>Twitter / X</span>
               </div>
               <span class="text-xs text-[#6e8eb8] group-hover:translate-x-1 transition-transform">↗</span>
            </a>

            <!-- TIKTOK -->
            <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-between bg-[#281b30] hover:bg-[#352340] text-[#d6a5f0] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#523366] shadow-sm hover:border-[#7b4d99] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">🎬</span>
                   <span>TikTok</span>
               </div>
               <span class="text-xs text-[#9d72b5] group-hover:translate-x-1 transition-transform">↗</span>
            </a>

            <!-- DISCORD -->
            <a href="https://discord.com" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-between bg-[#1d262a] hover:bg-[#253238] text-[#9ee0cb] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#324f46] shadow-sm hover:border-[#487567] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">💬</span>
                   <span>Discord Server</span>
               </div>
               <span class="text-xs text-[#659e8d] group-hover:translate-x-1 transition-transform">↗</span>
            </a>

            <!-- TWITCH -->
            <a href="https://twitch.tv" target="_blank" rel="noopener noreferrer" 
               class="group flex items-center justify-between bg-[#241a2e] hover:bg-[#30213d] text-[#c9a5f0] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#48335c] shadow-sm hover:border-[#6a4c87] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">👾</span>
                   <span>Twitch Streams</span>
               </div>
               <span class="text-xs text-[#8c6da6] group-hover:translate-x-1 transition-transform">↗</span>
            </a>

            <!-- EMAIL -->
            <a href="mailto:your-email@example.com" 
               class="group flex items-center justify-between bg-[#29261a] hover:bg-[#363220] text-[#ebd288] font-heading font-medium text-base py-3.5 px-5 rounded-2xl border border-[#544d30] shadow-sm hover:border-[#807548] transition-all duration-200">
               <div class="flex items-center gap-3">
                   <span class="text-xl group-hover:scale-110 transition-transform">💌</span>
                   <span>Contact Email</span>
               </div>
               <span class="text-xs text-[#a69760] group-hover:translate-x-1 transition-transform">✉</span>
            </a>

        </div>

        <!-- FOOTER -->
        <div class="mt-8 pt-4 border-t border-[#302a45] text-xs text-[#8d79a5] font-medium text-center">
            <span>🎪 Dark Circus Edition • Social Hub 🍿</span>
        </div>

    </div>

</body>
</html>
