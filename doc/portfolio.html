<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎪 • PortFolio 🎪</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Subtle dark pastel carnival stripe background pattern */
        .dark-circus-bg {
            background-color: #121019;
            background-image: repeating-linear-gradient(
                45deg,
                #121019,
                #121019 35px,
                #1a1726 35px,
                #1a1726 70px
            );
        }

        /* Subtle glowing border animation */
        @keyframes soft-pulse {
            0%, 100% { border-color: #6b3345; }
            50% { border-color: #4c3761; }
        }
        .pulse-border {
            animation: soft-pulse 4s infinite ease-in-out;
        }

        /* F9 Debug animation */
        @keyframes switchAnim {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
            50% { transform: scale(0.92) rotate(1.5deg); opacity: 0.6; filter: blur(2px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
        }
        .animate-switch {
            animation: switchAnim 0.35s ease-in-out;
        }

        /* Mini equalizer bar animation */
        @keyframes eq-bar {
            0%, 100% { height: 3px; }
            50% { height: 12px; }
        }
        .animate-eq-1 { animation: eq-bar 0.8s ease-in-out infinite; }
        .animate-eq-2 { animation: eq-bar 1.1s ease-in-out infinite 0.2s; }
        .animate-eq-3 { animation: eq-bar 0.7s ease-in-out infinite 0.4s; }
    </style>
</head>
<body class="dark-circus-bg min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-10 text-slate-200">
